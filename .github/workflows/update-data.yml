name: Update HDB Resale Data

on:
  schedule:
    - cron: '0 0 * * 5'  # Every Friday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Download latest data and geocode new addresses
        run: python scripts/geocode_pipeline.py

      - name: Build Arrow file (incremental)
        run: python scripts/build_arrow.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/hdb_data.arrow public/data/addresses_geocoded.json public/data/HDBResalePriceIndex1Q2009100Quarterly.csv
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit"
          else
            git commit -m "chore: update HDB resale data $(date +'%Y-%m-%d')"
            git push
          fi
