name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 5'  # Every Friday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore generated data cache
        uses: actions/cache@v4
        with:
          path: |
            public/data/addresses_geocoded.json
            public/data/rental_manifest.json
            public/data/rental_data-*.json
          key: generated-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            generated-data-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test data builders
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Download latest data and geocode new addresses
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: python scripts/geocode_pipeline.py

      - name: Build yearly Arrow files
        run: python scripts/build_arrow.py

      - name: Build HDB whole-flat rental asset
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python scripts/build_rental.py
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Test web application
        run: npm test
        
      - name: Build
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
